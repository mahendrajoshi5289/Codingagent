name: Test Agent Environment

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show runner resources
        run: |
          echo "=== OS ==="
          uname -a
          echo

          echo "=== CPU ==="
          nproc
          echo

          echo "=== MEMORY ==="
          free -h
          echo

          echo "=== DISK ==="
          df -h /
          echo

          echo "=== PYTHON ==="
          python --version

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        working-directory: demo
        run: pytest

name: Test Agent Environment

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            wget

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

      - name: Build llama.cpp
        run: |
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build llama.cpp/build \
            --config Release \
            -j$(nproc)

      - name: Restore model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: model
          key: qwen25-coder-7b-q4km-v1

      - name: Download Qwen model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p model

          wget -O model/qwen2.5-coder-7b-instruct-q4_k_m.gguf \
            https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q4_k_m.gguf

      - name: Run Qwen
        run: |
          llama.cpp/build/bin/llama-cli \
            -m model/qwen2.5-coder-7b-instruct-q4_k_m.gguf \
            -p "Write a Python function called multiply(a, b) that returns the product of a and b. Return only the Python function." \
            -n 128 \
            --temp 0.2 \
            -st

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        working-directory: demo
        run: pytest
